# =============================================================================
#  pg_hba для pg-master. Подключается через -c hba_file=...
#
#  ВАЖНО: строка `host all all ... scram-sha-256` НЕ покрывает подключения
#  для репликации — в колонке database значение `all` не включает
#  псевдо-базу `replication`. Нужна отдельная строка, иначе реплики и
#  Debezium (он тоже открывает replication-соединение) не подключатся с
#  ошибкой "no pg_hba.conf entry for replication connection".
# =============================================================================
# TYPE   DATABASE      USER          ADDRESS       METHOD

local    all           all                         trust
host     all           all           127.0.0.1/32  trust
host     all           all           ::1/128       trust

# Обычные подключения из docker-сети
host     all           all           all           scram-sha-256

# Репликационные подключения:
#  - replicator: физические реплики + pg_basebackup
#  - debezium:   логическое декодирование (pgoutput)
host     replication   replicator    all           scram-sha-256
host     replication   debezium      all           scram-sha-256
host     replication   postgres      all           scram-sha-256
