# pg-master — источник CDC (PostgreSQL 17)

listen_addresses = '*'
password_encryption = scram-sha-256

# Обязателен для pgoutput/логического декодирования.
wal_level = logical

# 2 физических слота реплик + логический слот CDC + запас.
max_replication_slots = 12
max_wal_senders = 12
hot_standby = on
wal_keep_size = 1GB

# Видно, что слот создал не Debezium: в логе от коннектора только
# START_REPLICATION на готовом слоте.
log_replication_commands = on
log_line_prefix = '%m [%p] %q%u@%d '

# -----------------------------------------------------------------------------
# synchronized_standby_slots = 'replica_1_slot,replica_2_slot'
#
# Придерживает поток CDC, пока реплики не подтвердят приём WAL — иначе после
# промоушена синхронизированный слот на реплике окажется «в прошлом».
# ВЫКЛЮЧЕНО СОЗНАТЕЛЬНО: с ним упавшая или отстающая реплика молча
# останавливает CDC, а на стенде это выглядит как «события не идут».
# Включать вместе с мониторингом лага реплик.
# -----------------------------------------------------------------------------
