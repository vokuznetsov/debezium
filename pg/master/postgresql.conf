# =============================================================================
#  pg-master — PostgreSQL 17.9, источник CDC
#
#  Подключается через  postgres -c config_file=/etc/postgresql/postgresql.conf
#  Файл читается ПЕРЕД $PGDATA/postgresql.auto.conf, то есть auto.conf
#  (куда пишет ALTER SYSTEM) при конфликте побеждает.
# =============================================================================

listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
password_encryption = scram-sha-256

# -----------------------------------------------------------------------------
#  WAL и логическое декодирование
# -----------------------------------------------------------------------------
# logical обязателен для pgoutput. Менять на replica нельзя — логическое
# декодирование перестанет работать, слот станет нечитаемым.
wal_level = logical

# Запас по слотам и walsender'ам:
#   2 физических слота реплик
# + 1 логический слот CDC (dbz_cdc_slot)
# + резерв на ручные проверки, второй CDC-коннектор и pg_basebackup
# Слоты — это ГЛОБАЛЬНЫЙ лимит на кластер, при его исчерпании создание
# слота падает, а не ждёт. Не жадничать.
max_replication_slots = 12
max_wal_senders = 12

# Нужен, чтобы реплики принимали читающие соединения (и чтобы после
# промоушена реплика могла работать как мастер с теми же настройками).
hot_standby = on

# Сколько WAL держать для отставших standby ПОМИМО их слотов. Слоты сами
# держат WAL, wal_keep_size — подстраховка на время пересоздания слота.
wal_keep_size = 1GB

# max_slot_wal_keep_size ОСТАВЛЕН ДЕФОЛТНЫМ (-1, без ограничения).
# С лимитом Postgres при его превышении инвалидирует слот, а инвалидация
# логического слота CDC = полная пересинхронизация (А) и (Б). Дешевле
# упереться в диск с алертом, чем молча потерять слот.
# В контуре: ставить лимит только вместе с мониторингом лага слота.
#max_slot_wal_keep_size = -1

# -----------------------------------------------------------------------------
#  Failover-слоты (PostgreSQL 17)
# -----------------------------------------------------------------------------
# Придерживает walsender'ы логических слотов до тех, пока перечисленные
# физические слоты не подтвердят приём WAL. Смысл: логический подписчик
# (Debezium) не может уехать вперёд реплик, поэтому после промоушена реплики
# синхронизированный слот на ней не оказывается «в будущем».
#
# ЦЕНА: CDC становится зависим от здоровья реплик. Отстала или упала реплика —
# поток CDC притормаживает (walsender ждёт). Это осознанный размен:
# целостность при failover в обмен на независимость от standby.
#
# Список ОБЯЗАН совпадать с REPLICA1_SLOT/REPLICA2_SLOT из .env.
# Расхождение = слоты не придерживаются, failover-слот теряет смысл, и это
# никак не проявляется до самого переключения.
synchronized_standby_slots = 'replica_1_slot,replica_2_slot'

# -----------------------------------------------------------------------------
#  Логи
# -----------------------------------------------------------------------------
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_min_messages = info
# Пишет в лог CREATE_REPLICATION_SLOT / START_REPLICATION. Именно этим
# доказывается, что слот создал devops, а не Debezium: в логе видно, что
# коннектор делает только START_REPLICATION на готовом слоте.
log_replication_commands = on
log_checkpoints = off
