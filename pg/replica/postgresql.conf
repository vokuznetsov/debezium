# pg-replica-1 / pg-replica-2 — hot standby.
#
# primary_conninfo и primary_slot_name сюда НЕ пишутся: их создаёт
# pg_basebackup -R в $PGDATA/postgresql.auto.conf, который читается позже
# этого файла и перекрывает его.

listen_addresses = '*'
password_encryption = scram-sha-256

# На standby тоже logical: иначе slotsync-воркер не сможет держать локальные
# копии логических слотов.
wal_level = logical
max_replication_slots = 12
max_wal_senders = 12
hot_standby = on

# Синхронизация failover-слотов с мастера (PG 17). Работает только если в
# primary_conninfo есть dbname — это делает pg/replica/entrypoint.sh.
sync_replication_slots = on
hot_standby_feedback = on

# synchronized_standby_slots здесь задавать НЕЛЬЗЯ: параметр действует только
# на primary, а после промоушена заставит новый мастер ждать подтверждения от
# слотов, которых на нём нет — CDC встанет насовсем.

log_line_prefix = '%m [%p] %q%u@%d '
