# =============================================================================
#  pg-replica-1 / pg-replica-2 — hot standby с синхронизацией слотов (PG 17)
#
#  primary_conninfo и primary_slot_name сюда НЕ пишутся: их создаёт
#  pg_basebackup -R в $PGDATA/postgresql.auto.conf, который читается после
#  этого файла и перекрывает его. У каждой реплики свой слот, поэтому файл
#  общий, а слот приходит через -S при бутстрапе.
# =============================================================================

listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
password_encryption = scram-sha-256

# На standby wal_level должен быть logical, иначе slotsync-воркер не сможет
# создавать локальные копии логических слотов (они логические по природе).
wal_level = logical
max_replication_slots = 12
max_wal_senders = 12

# Обязателен: без него реплика не принимает читающие соединения и
# синхронизация слотов не работает.
hot_standby = on

# -----------------------------------------------------------------------------
#  Синхронизация failover-слотов
# -----------------------------------------------------------------------------
# Включает slotsync-воркер: он подключается к мастеру, находит логические
# слоты с failover = true и поддерживает их локальные копии
# (pg_replication_slots.synced = true).
#
# Требования, без которых воркер молча не сделает ничего:
#   1. hot_standby_feedback = on (ниже);
#   2. primary_slot_name задан (пишет pg_basebackup -R -S);
#   3. в primary_conninfo ЕСТЬ dbname — иначе воркер не может подключиться к
#      базе мастера и логирует ошибку. scripts/replica-entrypoint.sh это
#      проверяет и досоздаёт при необходимости;
#   4. пользователь из primary_conninfo имеет право REPLICATION.
sync_replication_slots = on

# Реплика сообщает мастеру свой xmin, мастер не вакуумит нужные ей версии
# строк. Для синхронизации слотов обязателен.
hot_standby_feedback = on

# -----------------------------------------------------------------------------
#  synchronized_standby_slots здесь СОЗНАТЕЛЬНО НЕ ЗАДАН.
#
#  Параметр действует только на primary. Если прописать его реплике, то после
#  промоушена (test-failover.sh) новый мастер начнёт придерживать walsender'ы
#  до подтверждения от слотов replica_1_slot/replica_2_slot, которых на нём
#  нет — и поток CDC встанет НАСОВСЕМ, без внятной ошибки.
#
#  Поэтому после промоушена devops обязан выставить его заново под новую
#  топологию (см. README, раздел 3, и scripts/test-failover.sh).
# -----------------------------------------------------------------------------

logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_min_messages = info
log_replication_commands = on
