# pg_hba для реплик (тот же, что у мастера: после промоушена ничего менять не надо).
#
# ВАЖНО: строка `host all all` НЕ покрывает репликацию — значение `all` в
# колонке database не включает псевдо-базу `replication`. Без отдельных строк
# ниже не подключатся ни реплики, ни Debezium.

# TYPE   DATABASE      USER         ADDRESS       METHOD
local    all           all                        trust
host     all           all          127.0.0.1/32  trust
host     all           all          all           scram-sha-256

host     replication   replicator   all           scram-sha-256
host     replication   debezium     all           scram-sha-256
