# =============================================================================
#  CDC-стенд: PostgreSQL (1 master + 2 реплики) -> Debezium -> Kafka
#
#  Всё поднимается одной командой:  docker compose up -d
#  Значения ${...} берутся из .env (см. пояснение в начале .env).
#  `docker compose down` данные сохраняет, `docker compose down -v` — стирает.
# =============================================================================

x-pg: &pg
  image: postgres:${POSTGRES_VERSION}
  restart: unless-stopped

services:

  # --- источник CDC ----------------------------------------------------------
  pg-master:
    <<: *pg
    container_name: pg-master
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - pg_master_data:/var/lib/postgresql/data
      - ./pg/master/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg/master/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # Выполняется автоматически ОДИН РАЗ — при первом старте на пустом томе.
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PG_MASTER_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20
      start_period: 15s

  # --- реплики: pg_basebackup на готовых физических слотах --------------------
  pg-replica-1:
    <<: *pg
    container_name: pg-replica-1
    depends_on:
      pg-master: { condition: service_healthy }
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_HOST: pg-master
      REPLICA_NAME: pg-replica-1
      REPLICA_SLOT: replica_1_slot
      REPL_USER: ${REPL_USER}
      REPL_PASSWORD: ${REPL_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: ["bash", "/entrypoint.sh"]
    volumes:
      - pg_replica1_data:/var/lib/postgresql/data
      - ./pg/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg/replica/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./pg/replica/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "${PG_REPLICA1_PORT}:5432"

  pg-replica-2:
    <<: *pg
    container_name: pg-replica-2
    depends_on:
      pg-master: { condition: service_healthy }
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_HOST: pg-master
      REPLICA_NAME: pg-replica-2
      REPLICA_SLOT: replica_2_slot
      REPL_USER: ${REPL_USER}
      REPL_PASSWORD: ${REPL_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: ["bash", "/entrypoint.sh"]
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
      - ./pg/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg/replica/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./pg/replica/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "${PG_REPLICA2_PORT}:5432"

  # --- Kafka (KRaft, один брокер) --------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION}
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 1 партиция по умолчанию: топик cdc.events создаётся сам при первом
      # событии и обязан быть однопартиционным (порядок гарантируется только
      # внутри партиции).
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms512M -Xmx1G
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_PORT}:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null"]
      interval: 5s
      retries: 30
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:${CONFLUENT_VERSION}
    container_name: schema-registry
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256M -Xmx512M
    ports:
      - "${SCHEMA_REGISTRY_PORT}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      retries: 30
      start_period: 20s

  # --- Kafka Connect + плагин Debezium ---------------------------------------
  connect:
    build:
      context: .
      dockerfile: Dockerfile.connect
      args:
        CONFLUENT_VERSION: ${CONFLUENT_VERSION}
        DEBEZIUM_VERSION: ${DEBEZIUM_VERSION}
    image: cdc-connect:${CONFLUENT_VERSION}-dbz${DEBEZIUM_VERSION}
    container_name: connect
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      pg-master: { condition: service_healthy }
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: cdc-connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_PARTITIONS: 1
      CONNECT_STATUS_STORAGE_PARTITIONS: 1
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Без этой политики Connect МОЛЧА игнорирует producer.override.* из
      # конфига коннектора (zstd, linger, гарантии порядка) и берёт настройки
      # воркера.
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
      KAFKA_HEAP_OPTS: -Xms256M -Xmx1G
    ports:
      - "${CONNECT_PORT}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      retries: 40
      start_period: 30s

  # --- UI: топики, сообщения, схемы, состояние коннектора --------------------
  kafka-ui:
    image: ${KAFKA_UI_IMAGE}
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: cdc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports:
      - "${KAFKA_UI_PORT}:8080"

volumes:
  pg_master_data:
  pg_replica1_data:
  pg_replica2_data:
  kafka_data:
